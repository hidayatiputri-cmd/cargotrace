$kind: http-request
description: Add append-only tracking event with GPS coordinates (Operator/Admin only).
url: "{{base_url}}/shipments/{{shipment_id}}/tracking"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "status": "in_transit",
        "event_type": "waypoint_ping",
        "event_time": "2026-11-23 15:30:00",
        "latitude": 5.923000,
        "longitude": 80.512000,
        "description": "Transiting Galle maritime corridor. Vessel speed: 20.4 knots."
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
