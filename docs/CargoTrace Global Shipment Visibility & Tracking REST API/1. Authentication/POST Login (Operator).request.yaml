$kind: http-request
description: Login as Logistics Operator. Stores bearer token in {{token}} variable.
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "operator@cargotrace.test",
        "password": "password",
        "device_name": "Postman-Operator"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.access_token) {
          pm.collectionVariables.set('token', jsonData.access_token);
          pm.collectionVariables.set('operator_token', jsonData.access_token);
          console.log('Operator token saved to collection variable: ' + jsonData.access_token);
      }
    language: text/javascript
order: 3000
