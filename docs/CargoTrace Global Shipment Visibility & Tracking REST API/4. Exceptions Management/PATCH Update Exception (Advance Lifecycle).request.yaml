$kind: http-request
description: "Update exception status: OPEN -> INVESTIGATING -> RESOLVED."
url: "{{base_url}}/exceptions/{{exception_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "status": "INVESTIGATING",
        "investigation_notes": "Operations desk in communication with master vessel for updated ETA."
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
